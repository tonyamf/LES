name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      # Test labels are listed on purpose: plain `manage.py test` would also run the
      # Selenium tests in FuncionalTests/, which need a browser.
      - run: python manage.py test Activities Core Users Processes -v 2
